<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css"> <!-- Fixed CSS Link -->
  <title>Frontend Mentor | Huddle landing page</title>
</head>
<body>

  <!-- The main container wrapper managing the full screen -->
  <div class="page-wrapper">
    
    <header class="main-header">
      <img src="./images/logo.svg" alt="huddle_logo" class="logo">
    </header>

    <!-- The flex/grid container wrapping the two columns -->
    <main class="content-container">
      
      <!-- Left Box -->
      <div class="image-selection">
        <img src="images/illustration-mockups.svg" alt="App Mockups" class="mockup-img">
      </div>

      <!-- Right Box -->
      <section class="text-section">
        <h1>Build The Community Your Fans Will Love</h1>
        <p> 
          Huddle re-imagines the way we build communities. You have a voice, but so does your audience. 
          Create connections with your users as you engage in genuine discussion.
        </p>
        <button class="cta-btn">Register</button>
      </section>

    </main>

    <footer class="social-footer">
      <a href="#" class="icon-link"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="icon-link"><i class="fab fa-twitter"></i></a>
      <a href="#" class="icon-link"><i class="fab fa-instagram"></i></a>
    </footer>

  </div>

</body>
</html>
